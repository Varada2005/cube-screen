<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>the cube · pixel screen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="name">the cube</span>
        <span class="sub">pixel screen prototype</span>
      </div>
      <button class="round" id="settings-toggle" aria-label="Settings" aria-expanded="false" aria-controls="panel" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </header>

    <main class="stage">
      <section class="view">
        <div class="device">
          <span class="knob knob-l"></span>
          <span class="knob knob-r"></span>
          <div class="bezel"><div class="window"><canvas class="screen" id="screen-main"></canvas></div></div>
        </div>
        <div class="transport">
          <button class="round" id="prev-main" aria-label="Previous image"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <span class="counter" id="counter-main"></span>
          <button class="round" id="next-main" aria-label="Next image"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="strip" id="strip-main"></div>
        <p class="hint">Drop PNG or JPG files anywhere · ← → to step · drag thumbnails to reorder</p>
      </section>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-label="Settings" inert>
    <div class="panel-head">
      <h2>Display</h2>
      <button class="round small" id="settings-close" aria-label="Close settings" title="Close (Esc)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="field">
      <span class="label">Resolution</span>
      <div class="seg" id="res">
        <button data-res="24">24</button>
        <button data-res="32">32</button>
        <button data-res="64">64</button>
      </div>
    </div>
    <label class="switch-row">
      <span>Matte <small>e-ink look</small></span>
      <input type="checkbox" data-setting="matte"><span class="switch"></span>
    </label>
    <div class="slider">
      <div class="slider-head"><span>Brightness</span><output data-for="brightness"></output></div>
      <input type="range" data-setting="brightness" min="0.3" max="1.6" step="0.01">
    </div>
    <div class="slider">
      <div class="slider-head"><span>Glow</span><output data-for="glow"></output></div>
      <input type="range" data-setting="glow" min="0" max="1.5" step="0.01">
    </div>
    <div class="slider">
      <div class="slider-head"><span>Diffuser</span><output data-for="blur"></output></div>
      <input type="range" data-setting="blur" min="0" max="1" step="0.01">
    </div>
    <div class="slider">
      <div class="slider-head"><span>Gap</span><output data-for="gap"></output></div>
      <input type="range" data-setting="gap" min="0.05" max="0.35" step="0.01">
    </div>

    <h2>Playback</h2>
    <label class="switch-row">
      <span>Transition</span>
      <input type="checkbox" data-setting="transition"><span class="switch"></span>
    </label>
    <label class="switch-row">
      <span>Auto-play</span>
      <input type="checkbox" data-setting="autoplay"><span class="switch"></span>
    </label>
    <label class="field inline">
      <span class="label">Interval</span>
      <span class="number"><input type="number" data-setting="interval" min="0.5" max="60" step="0.5"> s</span>
    </label>

    <button class="ghost" id="reset">Reset settings</button>
    <p class="saved" id="saved" aria-live="polite">Settings are saved in this browser</p>
  </aside>

  <div class="drop-overlay" id="drop-overlay"><div><span>Drop images to add</span></div></div>

  <script src="js/screen.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
